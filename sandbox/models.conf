# Model catalog preferences — single source of truth for run.sh.
#
# OpenCode's model catalog is bundled in the binary and changes between
# releases (models are added, renamed and retired), so never hardcode a single
# reference: each list is an ordered preference list and the FIRST entry that
# exists in the sandbox catalog wins. Update these when the catalog moves.
#
# Check what the sandbox actually sees with:  opencode-sb models --check

# Free tier (opencode provider): preferred ref, then any "*-free" fallback so a
# rename does not break the default.
FREE_PREFERRED="opencode/deepseek-v4.1-flash-free"
FREE_PATTERN="^opencode/.*-free$"

# Local (llama.cpp): large-context single model, then the 256K max as fallback.
LOCAL_LARGE="llama.cpp/qwen3.8-gguf-single192 llama.cpp/qwen3.8-gguf-max"

# Local (llama.cpp): multi-slot models for parallel agents (2x128K then 4x64K).
LOCAL_PARALLEL="llama.cpp/qwen3.8-gguf-duo128 llama.cpp/qwen3.8-gguf-quad"
